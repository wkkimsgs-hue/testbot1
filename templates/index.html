<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 720px;
      padding: 32px;
    }
    h1 {
      font-size: 1.4rem;
      color: #1a1a2e;
      margin-bottom: 24px;
      text-align: center;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
    }
    textarea {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.95rem;
      resize: vertical;
      outline: none;
      transition: border 0.2s;
    }
    textarea:focus { border-color: #6c63ff; }
    #input-area { height: 120px; margin-bottom: 16px; }
    #output-area {
      height: 280px;
      background: #f9f9fb;
      color: #333;
      white-space: pre-wrap;
      overflow-y: auto;
    }
    .btn-row {
      display: flex;
      gap: 10px;
      margin: 16px 0;
    }
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s, opacity 0.2s;
    }
    #submit-btn {
      background: #6c63ff;
      color: #fff;
    }
    #submit-btn:hover { background: #574fd6; }
    #submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    #clear-btn {
      background: #eee;
      color: #555;
      flex: 0 0 auto;
      width: 90px;
    }
    #clear-btn:hover { background: #ddd; }
    .status {
      font-size: 0.8rem;
      color: #999;
      text-align: right;
      margin-top: 4px;
    }
    .error { color: #e74c3c; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Claude Chat</h1>

    <label for="input-area">메시지 입력</label>
    <textarea id="input-area" placeholder="여기에 메시지를 입력하세요..."></textarea>

    <div class="btn-row">
      <button id="submit-btn">전송</button>
      <button id="clear-btn">지우기</button>
    </div>

    <label for="output-area">Claude 응답</label>
    <textarea id="output-area" readonly placeholder="응답이 여기에 표시됩니다."></textarea>
    <div class="status" id="status"></div>
  </div>

  <script>
    const submitBtn = document.getElementById('submit-btn');
    const clearBtn = document.getElementById('clear-btn');
    const inputArea = document.getElementById('input-area');
    const outputArea = document.getElementById('output-area');
    const status = document.getElementById('status');

    async function sendMessage() {
      const message = inputArea.value.trim();
      if (!message) return;

      submitBtn.disabled = true;
      outputArea.className = '';
      outputArea.value = '';
      status.textContent = '응답 대기 중...';
      status.className = 'status';

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message }),
        });
        const data = await res.json();

        if (data.error) {
          outputArea.value = data.error;
          outputArea.className = 'error';
          status.textContent = '오류 발생';
          status.className = 'status error';
        } else {
          outputArea.value = data.reply;
          status.textContent = '완료';
        }
      } catch (e) {
        outputArea.value = '네트워크 오류: ' + e.message;
        status.className = 'status error';
      } finally {
        submitBtn.disabled = false;
      }
    }

    submitBtn.addEventListener('click', sendMessage);
    clearBtn.addEventListener('click', () => {
      inputArea.value = '';
      outputArea.value = '';
      status.textContent = '';
    });
    inputArea.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) sendMessage();
    });
  </script>
</body>
</html>
